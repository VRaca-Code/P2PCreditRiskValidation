# ci.yml - continuous integration on GitHub Actions.
# What it does: on every push to main and every pull request, installs the package with the
# dev, XGBoost and SHAP extras on Python 3.10-3.12 and runs the pytest suite. PyTorch is not
# installed in CI, so the DNN/KAN tests skip there; run them locally or in Colab.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + optional boosters and SHAP)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,boost,explain]"
      - name: Run tests
        run: pytest -q
